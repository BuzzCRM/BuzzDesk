          su -c "bin/buzzdesk.Console.pl Dev::UnitTest::Run --directory Selenium/Base" - buzzdesk

      - name: Archive screenshots from selenium
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Upload Selenium Screenshots - Base
          retention-days: 1
          path: /opt/buzzdesk/var/httpd/htdocs/SeleniumScreenshots/**/*
          if-no-files-found: ignore


