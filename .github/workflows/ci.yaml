      - name: Install dependencies
        run: .github/workflows/ci/dependencies.sh

      - name: Setup BuzzDesk
        run: .github/workflows/ci/setup.sh

      - name: Check RPMSpec
        run: |
          git init
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          su -c "bin/buzzdesk.Console.pl Dev::Tools::RPMSpecGenerate" - buzzdesk
          git diff --exit-code scripts/auto_build/spec/
          if [ "$(git diff --exit-code scripts/auto_build/spec/)" ]; then echo "The RPMSpec's are not updated." && exit 1; else echo "All RPMSpec's are updated." && exit 0; fi

  UnitTest-MySQL:
    name: UnitTest:MySQL
    runs-on: ubuntu-latest
    container: debian:12-slim
    needs: [
      BuzzDeskCodePolicy,
      Contributors,
      Database-Schema,
      Database-InitialInsert,
      Migration,
      RPMSpec,
    ]
    env:
      DB: mysql
      MYSQL_USER: "buzzdesk"
      MYSQL_ROOT_PASSWORD: "secret"
      MYSQL_PASSWORD: "secret"
      MYSQL_DATABASE: "buzzdesk"
    services:
      mariadb:
        image: mariadb:10
        env:
          MYSQL_USER: "buzzdesk"
          MYSQL_ROOT_PASSWORD: "secret"
          MYSQL_PASSWORD: "secret"
          MYSQL_DATABASE: "buzzdesk"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        env:
          fetch-depth: "1"

      - name: Install dependencies
        run: .github/workflows/ci/dependencies.sh

      - name: Setup BuzzDesk
        run: .github/workflows/ci/setup.sh

      - name: Run UnitTests
        run: |
          su -c "bin/buzzdesk.CheckSum.pl -a create" - buzzdesk
          su -c "bin/buzzdesk.Console.pl Dev::UnitTest::Run ${{ inputs.unittest_options }} --exclude-directory Selenium" - buzzdesk

  Selenium-Base:
    name: Selenium:Base
    runs-on: ubuntu-latest
    container: debian:12-slim
    needs: UnitTest-MySQL
    env:
      DB: mysql
      MYSQL_USER: "buzzdesk"
      MYSQL_ROOT_PASSWORD: "secret"
      MYSQL_PASSWORD: "secret"
      MYSQL_DATABASE: "buzzdesk"
      SELENIUM_SCREENSHOTS: "true"
    services:
      mariadb:
        image: mariadb:10
        env:
          MYSQL_USER: "buzzdesk"
          MYSQL_ROOT_PASSWORD: "secret"
          MYSQL_PASSWORD: "secret"
          MYSQL_DATABASE: "buzzdesk"
      chrome:
        image: selenium/standalone-chrome:3.141.59-oxygen
        options: --shm-size="2g"
        volumes:
          - ${{ github.workspace }}:/opt/buzzdesk
    steps:
