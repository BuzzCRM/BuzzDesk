        image: mariadb:10
        env:
          MYSQL_USER: "buzzdesk"
          MYSQL_ROOT_PASSWORD: "secret"
          MYSQL_PASSWORD: "secret"
          MYSQL_DATABASE: "buzzdesk"
    steps:
      - name: Check out repository code
